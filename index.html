<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - Adexium</title>

    <link rel="preconnect" href="https://telegram.org" crossorigin>
    <link rel="preconnect" href="https://cdn.adexium.tech" crossorigin>
    <link rel="preconnect" href="https://cdn.tgads.space" crossorigin>

    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>

    <!-- Adexium Widget Script (ড্যাশবোর্ড ও ডকুমেন্টেশন অনুযায়ী adexium-widget.min.js) -->
    <script type="text/javascript" src="https://cdn.adexium.tech/assets/js/adexium-widget.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #333);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 14px;
        }
        .info-box {
            background: rgba(0, 136, 204, 0.1);
            border: 1px solid var(--tg-theme-button-color, #0088cc);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: left;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: rgba(0,0,0,0.04);
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .status {
            font-size: 0.92rem;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 10px;
            font-weight: 500;
            min-height: 22px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Adexium Ads</h2>

        <div class="info-box">
            <div>🌍 দেশ: <strong id="countryName">লোড হচ্ছে...</strong></div>
            <div>📱 পরিবেশ: <strong id="tgEnv">চেক করা হচ্ছে...</strong></div>
        </div>

        <div class="toggle-row">
            <label for="debugToggle">Test Mode (Debug অ্যাড):</label>
            <input type="checkbox" id="debugToggle">
        </div>

        <button id="showAdBtn">AD দেখুন (Instant)</button>

        <div class="status" id="statusText">প্রস্তুত...</div>
    </div>

    <script type="text/javascript">
        const WIDGET_ID = '5c539725-5862-4b1a-8f9b-5130f48a98b4';
        const AD_FORMAT = 'interstitial';

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        fetch('https://get.geojs.io/v1/ip/geo.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('countryName').innerText = data.country || 'অজানা';
            })
            .catch(() => {
                document.getElementById('countryName').innerText = 'অজানা';
            });

        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('statusText');
            const showAdBtn = document.getElementById('showAdBtn');
            const debugToggle = document.getElementById('debugToggle');
            const tgEnv = document.getElementById('tgEnv');

            if (tg && tg.initData) {
                tgEnv.innerText = 'Telegram Mini App (সঠিক)';
            } else {
                tgEnv.innerText = 'সাধারণ ব্রাউজার (বটের ভেতর থেকে খুলুন!)';
            }

            let adexiumAds = null;
            let requestTimeout = null;
            let isRequesting = false;

            function initAdexium(isDebug) {
                clearTimeout(requestTimeout);
                isRequesting = false;

                if (typeof AdexiumWidget === 'undefined') {
                    return false;
                }

                try {
                    adexiumAds = new AdexiumWidget({
                        wid: WIDGET_ID,
                        adFormat: AD_FORMAT,
                        debug: isDebug
                    });

                    adexiumAds.on('adReceived', (ad) => {
                        clearTimeout(requestTimeout);
                        isRequesting = false;
                        showAdBtn.disabled = false;
                        statusText.innerText = '✅ AD পাওয়া গেছে, প্রদর্শন করা হচ্ছে...';
                        adexiumAds.displayAd(ad);
                    });

                    adexiumAds.on('noAdFound', () => {
                        clearTimeout(requestTimeout);
                        isRequesting = false;
                        showAdBtn.disabled = false;
                        statusText.innerText = '⚠️ এই মুহূর্তে কোনো Real AD নেই (noAdFound)।';
                    });

                    adexiumAds.on('adClosed', () => {
                        clearTimeout(requestTimeout);
                        isRequesting = false;
                        showAdBtn.disabled = false;
                        statusText.innerText = 'AD দেখা সম্পন্ন হয়েছে।';
                    });

                    statusText.innerText = isDebug
                        ? 'Test Mode প্রস্তুত (শুধু টেস্ট অ্যাড আসবে)।'
                        : 'Real Mode প্রস্তুত।';
                    showAdBtn.disabled = false;
                    return true;
                } catch (err) {
                    console.error('Adexium init error:', err);
                    statusText.innerText = '❌ Adexium সেটআপে সমস্যা হয়েছে!';
                    return false;
                }
            }

            // প্রথম CDN লোড না হলে ড্যাশবোর্ডের cdn.tgads.space থেকে ব্যাকআপ লোড
            if (!initAdexium(false)) {
                statusText.innerText = 'ব্যাকআপ সার্ভার থেকে স্ক্রিপ্ট লোড হচ্ছে...';
                showAdBtn.disabled = true;
                const fallbackScript = document.createElement('script');
                fallbackScript.type = 'text/javascript';
                fallbackScript.src = 'https://cdn.tgads.space/assets/js/adexium-widget.min.js';
                fallbackScript.onload = () => initAdexium(debugToggle.checked);
                fallbackScript.onerror = () => {
                    statusText.innerText = '❌ Adexium স্ক্রিপ্ট লোড হয়নি! AdBlocker বা Private DNS বন্ধ করুন।';
                };
                document.head.appendChild(fallbackScript);
            }

            debugToggle.addEventListener('change', () => {
                initAdexium(debugToggle.checked);
            });

            showAdBtn.addEventListener('click', () => {
                if (!adexiumAds || isRequesting) return;

                isRequesting = true;
                showAdBtn.disabled = true;
                statusText.innerText = 'AD লোড হচ্ছে...';

                requestTimeout = setTimeout(() => {
                    if (isRequesting) {
                        isRequesting = false;
                        showAdBtn.disabled = false;
                        statusText.innerText = '⏳ রেসপন্স আসতে দেরি হচ্ছে, আবার চেষ্টা করুন।';
                    }
                }, 10000);

                adexiumAds.requestAd(AD_FORMAT);
            });
        });
    </script>
</body>
</html>
