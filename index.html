<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - Monetization</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    
    <!-- Adexium Widget Script -->
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        /* Telegram Theming */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #333);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #333);
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-manual {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-auto {
            background-color: #28a745;
            color: #fff;
        }
        .btn-auto.stop {
            background-color: #dc3545;
        }
        .status {
            font-size: 0.95rem;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 10px;
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Adexium Monetization</h2>
        
        <div class="input-group">
            <label for="timeInput">কতো সেকেন্ড পর/পরপর AD চালু হবে:</label>
            <input type="number" id="timeInput" value="2" min="1">
        </div>

        <button class="btn-manual" id="manualAdBtn">AD দেখুন (ম্যানুয়াল)</button>
        <button class="btn-auto" id="autoAdBtn">Auto AD চালু করুন</button>
        
        <div class="status" id="statusText">অপেক্ষা করা হচ্ছে...</div>
    </div>

    <script type="text/javascript">
        // Initialize Telegram App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let adexiumAds;
        let autoAdInterval = null;
        let countdownTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('statusText');
            const manualAdBtn = document.getElementById('manualAdBtn');
            const autoAdBtn = document.getElementById('autoAdBtn');
            const timeInput = document.getElementById('timeInput');

            // ১. Adexium Widget Setup
            try {
                adexiumAds = new AdexiumWidget({
                    wid: 'f9d967a8-3d11-400d-be42-c3bf7ca61d84',
                    adFormat: 'interstitial'
                });

                // যখন সফলভাবে AD রিসিভ হবে
                adexiumAds.on('adReceived', (ad) => {
                    statusText.innerText = 'AD পাওয়া গেছে, প্রদর্শন করা হচ্ছে...';
                    adexiumAds.displayAd(ad); // AD স্ক্রিনে দেখানোর ফাংশন
                });

                // যখন কোনো AD পাওয়া যাবে না
                adexiumAds.on('noAdFound', () => {
                    statusText.innerText = 'এই মুহূর্তে কোনো AD পাওয়া যায়নি!';
                });

                // যখন ইউজার AD ক্লোজ করবে
                adexiumAds.on('adClosed', () => {
                    if(!autoAdInterval) {
                        statusText.innerText = 'অপেক্ষা করা হচ্ছে...';
                    } else {
                        statusText.innerText = 'পরবর্তী অটো AD-এর জন্য অপেক্ষা করা হচ্ছে...';
                    }
                });
            } catch (error) {
                console.error("Adexium initialization error:", error);
                statusText.innerText = 'Adexium লোড করতে সমস্যা হয়েছে!';
            }

            // AD রিকোয়েস্ট করার ফাংশন
            function fetchAd() {
                if (adexiumAds) {
                    statusText.innerText = 'AD লোড হচ্ছে...';
                    adexiumAds.requestAd('interstitial');
                }
            }

            // ২. ম্যানুয়াল বাটনের লজিক
            manualAdBtn.addEventListener('click', () => {
                if (countdownTimeout) clearInterval(countdownTimeout);
                
                const waitSeconds = parseInt(timeInput.value) || 2;
                let remaining = waitSeconds;
                
                manualAdBtn.disabled = true;
                statusText.innerText = `${remaining} সেকেন্ড পর ম্যানুয়াল AD চালু হবে...`;
                
                countdownTimeout = setInterval(() => {
                    remaining--;
                    if (remaining > 0) {
                        statusText.innerText = `${remaining} সেকেন্ড পর ম্যানুয়াল AD চালু হবে...`;
                    } else {
                        clearInterval(countdownTimeout);
                        countdownTimeout = null;
                        manualAdBtn.disabled = false;
                        fetchAd(); // সময় শেষ হলে AD রিকোয়েস্ট করবে
                    }
                }, 1000);
            });

            // ৩. অটো বাটনের লজিক
            autoAdBtn.addEventListener('click', () => {
                if (autoAdInterval) {
                    // যদি অটো AD চালু থাকে, তবে তা বন্ধ করুন
                    clearInterval(autoAdInterval);
                    autoAdInterval = null;
                    
                    // বাটনের স্টাইল রিস্টোর করা
                    autoAdBtn.innerText = 'Auto AD চালু করুন';
                    autoAdBtn.classList.remove('stop');
                    statusText.innerText = 'Auto AD বন্ধ করা হয়েছে।';
                } else {
                    // অটো AD চালু করুন
                    const intervalSeconds = parseInt(timeInput.value) || 2;
                    
                    // বাটনের স্টাইল চেঞ্জ করা
                    autoAdBtn.innerText = 'Auto AD বন্ধ করুন (Stop)';
                    autoAdBtn.classList.add('stop');
                    statusText.innerText = `প্রতি ${intervalSeconds} সেকেন্ড পরপর Auto AD চালু হবে...`;
                    
                    // প্রতি সিলেক্টেড সেকেন্ড পরপর AD রিকোয়েস্ট করবে
                    autoAdInterval = setInterval(() => {
                        fetchAd();
                    }, intervalSeconds * 1000);
                }
            });
        });
    </script>
</body>
</html>
