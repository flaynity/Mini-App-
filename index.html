<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - Monetization</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    
    <!-- Adexium Widget Script -->
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

    <style>
        /* Telegram Theming */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #333);
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        /* Country Show Box */
        .user-info {
            background: rgba(0, 136, 204, 0.1);
            border: 1px solid var(--tg-theme-button-color, #0088cc);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .user-info span {
            color: var(--tg-theme-button-color, #0088cc);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #333);
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-manual {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-auto {
            background-color: #28a745;
            color: #fff;
        }
        .btn-auto.stop {
            background-color: #dc3545;
        }
        .status {
            font-size: 0.95rem;
            color: var(--tg-theme-hint-color, #666);
            margin-top: 10px;
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Adexium Monetization</h2>
        
        <!-- ইউজার এর Country দেখানোর জন্য বক্স -->
        <div class="user-info">
            🌍 আপনার দেশ: <span id="countryName">খুঁজা হচ্ছে...</span>
        </div>
        
        <div class="input-group">
            <label for="timeInput">কতো সেকেন্ড পর/পরপর AD চালু হবে:</label>
            <input type="number" id="timeInput" value="0.1" min="0.01" step="0.01">
        </div>

        <button class="btn-manual" id="manualAdBtn">AD দেখুন (ম্যানুয়াল)</button>
        <button class="btn-auto" id="autoAdBtn">Auto AD চালু করুন</button>
        
        <div class="status" id="statusText">অপেক্ষা করা হচ্ছে...</div>
    </div>

    <script type="text/javascript">
        // Initialize Telegram App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ইউজারের Country লোড করার ফাংশন (Free IP API)
        fetch('https://get.geojs.io/v1/ip/geo.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('countryName').innerText = data.country; // যেমন: Bangladesh
            })
            .catch(error => {
                document.getElementById('countryName').innerText = 'অজানা';
                console.error('Country fetch error:', error);
            });

        let adexiumAds;
        let autoAdInterval = null;
        let manualTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('statusText');
            const manualAdBtn = document.getElementById('manualAdBtn');
            const autoAdBtn = document.getElementById('autoAdBtn');
            const timeInput = document.getElementById('timeInput');

            // ১. Adexium Widget Setup
            try {
                adexiumAds = new AdexiumWidget({
                    wid: 'f9d967a8-3d11-400d-be42-c3bf7ca61d84',
                    adFormat: 'interstitial',
                    debug: true // FIX: 'debug: true' অ্যাড চালু না হওয়ার সমস্যা ফিক্স করবে। এটি সবসময় Test Ad দিবে।
                });

                // যখন সফলভাবে AD রিসিভ হবে
                adexiumAds.on('adReceived', (ad) => {
                    statusText.innerText = 'AD প্রদর্শন করা হচ্ছে...';
                    adexiumAds.displayAd(ad); 
                });

                // যখন কোনো AD পাওয়া যাবে না (debug: true দিলে এটি আর আসবে না)
                adexiumAds.on('noAdFound', () => {
                    statusText.innerText = 'এই মুহূর্তে কোনো AD পাওয়া যায়নি!';
                });

                // যখন ইউজার AD ক্লোজ করবে
                adexiumAds.on('adClosed', () => {
                    if(!autoAdInterval) {
                        statusText.innerText = 'অপেক্ষা করা হচ্ছে...';
                    }
                });
            } catch (error) {
                console.error("Adexium initialization error:", error);
                statusText.innerText = 'Adexium লোড করতে সমস্যা হয়েছে!';
            }

            // AD রিকোয়েস্ট করার ফাংশন
            function fetchAd() {
                if (adexiumAds) {
                    adexiumAds.requestAd('interstitial');
                }
            }

            // ২. ম্যানুয়াল বাটনের লজিক
            manualAdBtn.addEventListener('click', () => {
                if (manualTimeout) clearTimeout(manualTimeout);
                
                const waitSeconds = parseFloat(timeInput.value) || 0.1;
                const waitMs = Math.floor(waitSeconds * 1000); 
                
                manualAdBtn.disabled = true;
                statusText.innerText = `${waitSeconds} সেকেন্ড পর AD চালু হবে...`;
                
                manualTimeout = setTimeout(() => {
                    manualAdBtn.disabled = false;
                    statusText.innerText = 'AD লোড হচ্ছে...';
                    fetchAd(); 
                }, waitMs);
            });

            // ৩. অটো বাটনের লজিক
            autoAdBtn.addEventListener('click', () => {
                if (autoAdInterval) {
                    // অটো AD বন্ধ করুন
                    clearInterval(autoAdInterval);
                    autoAdInterval = null;
                    
                    autoAdBtn.innerText = 'Auto AD চালু করুন';
                    autoAdBtn.classList.remove('stop');
                    statusText.innerText = 'Auto AD বন্ধ করা হয়েছে।';
                } else {
                    // অটো AD চালু করুন
                    const intervalSeconds = parseFloat(timeInput.value) || 0.1;
                    const intervalMs = Math.floor(intervalSeconds * 1000);
                    
                    autoAdBtn.innerText = 'Auto AD বন্ধ করুন (Stop)';
                    autoAdBtn.classList.add('stop');
                    statusText.innerText = `প্রতি ${intervalSeconds} সেকেন্ড পরপর Auto AD চলছে...`;
                    
                    fetchAd(); // সাথে সাথে প্রথম অ্যাড
                    
                    autoAdInterval = setInterval(() => {
                        fetchAd();
                    }, intervalMs);
                }
            });
        });
    </script>
</body>
</html>
